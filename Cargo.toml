[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nabour-labs/specjutsu"
homepage = "https://nabour-labs.github.io/specjutsu/"
rust-version = "1.80"

[workspace.dependencies]
sj-core = { path = "crates/sj-core", version = "0.6.0" }
sj-runners = { path = "crates/sj-runners", version = "0.6.0" }
sj-adapters = { path = "crates/sj-adapters", version = "0.6.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ignore = "0.4"
globset = "0.4"
regex = "1"
quick-xml = "0.37"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
proptest = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
