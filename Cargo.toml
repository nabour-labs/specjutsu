[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/nabour-labs/specjutsu"
rust-version = "1.80"

[workspace.dependencies]
sj-core = { path = "crates/sj-core", version = "0.0.1" }
sj-runners = { path = "crates/sj-runners", version = "0.0.1" }
sj-adapters = { path = "crates/sj-adapters", version = "0.0.1" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
regex = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
