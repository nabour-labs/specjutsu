name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The released sj that checks this repo. Never the binary built from the PR, so a change
  # can't approve itself. Bump deliberately after each release.
  SJ_VERSION: 0.2.0

defaults:
  run:
    # Explicit bash enables pipefail, so `sj ... | tee` still fails the step.
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Spec-to-test report on every push, using the pinned release.
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned sj
        run: ./.github/install-sj.sh "$SJ_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sj trace | tee -a "$GITHUB_STEP_SUMMARY"

  # Bootstrapping stage 2: the pinned release gates every PR (blocking).
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned sj
        run: ./.github/install-sj.sh "$SJ_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Gate (red-on-base)
        run: sj gate --base "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gate (red-before-green history)
        run: sj gate --since "$(git rev-list --max-parents=0 HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
