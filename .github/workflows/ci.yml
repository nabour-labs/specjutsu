name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Bootstrapping stage 1: report-only. Once v0.1 is released, switch this job to the
  # pinned released binary so a PR never grades itself.
  trace:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p specjutsu -- trace | tee -a "$GITHUB_STEP_SUMMARY"

  # Bootstrapping stage 1: report-only. Becomes blocking (and switches to the pinned released
  # binary) once v0.2 ships.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p specjutsu
      - run: ./target/debug/sj gate --base "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: ./target/debug/sj gate --since "$(git rev-list --max-parents=0 HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
